# Deploys the backend to Render only when a version tag is pushed
# (git tag v1.0.0 && git push origin v1.0.0). Pushes to branches never deploy.
# The tag is the version: v1.0.0 → APP_VERSION=1.0.0 on Render, shown on the
# admin dashboard. The tests must pass first; then Render builds that exact
# commit from the Dockerfile. Secrets (GitHub → Settings → Secrets → Actions):
#   RENDER_DEPLOY_HOOK_URL  Render → Settings → Deploy Hook
#   RENDER_API_KEY          Render → Account settings → API Keys
#   RENDER_SERVICE_ID       the srv-… id in the service's Render URL
name: Deploy backend

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Gradle runs on Java 25 (gradle/gradle-daemon-jvm.properties).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4

      - name: Run all backend tests
        run: |
          chmod +x gradlew
          ./gradlew test --console=plain -Porg.gradle.java.installations.paths=

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Set before the deploy, so the new server starts with this version.
      - name: Set APP_VERSION on Render from the tag
        env:
          API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          if [ -z "$API_KEY" ] || [ -z "$SERVICE_ID" ]; then echo "RENDER_API_KEY or RENDER_SERVICE_ID secret is missing"; exit 1; fi
          VERSION="${GITHUB_REF_NAME#v}"
          curl --fail --silent --show-error --request PUT \
            "https://api.render.com/v1/services/${SERVICE_ID}/env-vars/APP_VERSION" \
            --header "Authorization: Bearer ${API_KEY}" \
            --header "Content-Type: application/json" \
            --data "{\"value\":\"${VERSION}\"}" > /dev/null
          echo "APP_VERSION=${VERSION}"

      - name: Ask Render to deploy this tag's commit
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then echo "RENDER_DEPLOY_HOOK_URL secret is missing"; exit 1; fi
          curl --fail --silent --show-error --request POST "${HOOK}&ref=${GITHUB_SHA}" > /dev/null
          echo "Render is deploying ${GITHUB_REF_NAME} (${GITHUB_SHA})"
